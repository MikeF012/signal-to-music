<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Signal Synth</title>
    <style>
      /* Loading screen — pure CSS, shows before any JS parses */
      #loading-screen {
        position: fixed; inset: 0; z-index: 9999;
        background: #0e0508;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        transition: opacity 0.28s ease;
      }
      #loading-screen.fade-out { opacity: 0; pointer-events: none; }
      .ld-title {
        font-family: 'Courier New', monospace;
        font-size: 13px; letter-spacing: 0.2em;
        color: #c8a070; text-transform: uppercase;
        margin-bottom: 22px;
      }
      .ld-dots { display: flex; gap: 10px; }
      .ld-dot {
        width: 9px; height: 9px; border-radius: 50%;
        background: #e8a030;
        animation: ld-pop 1.1s ease-in-out infinite both;
      }
      .ld-dot:nth-child(2) { animation-delay: .18s; background: #00c896; }
      .ld-dot:nth-child(3) { animation-delay: .36s; background: #c840a0; }
      @keyframes ld-pop {
        0%, 80%, 100% { transform: scale(0.4); opacity: 0.3; }
        40%            { transform: scale(1);   opacity: 1;   }
      }
    </style>
  </head>
  <body>
    <div id="loading-screen" aria-hidden="true">
      <div class="ld-title">Signal Synth</div>
      <div class="ld-dots">
        <div class="ld-dot"></div>
        <div class="ld-dot"></div>
        <div class="ld-dot"></div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
